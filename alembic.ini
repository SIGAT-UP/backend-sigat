# Migraciones PROPIAS del backend (esquemas `api` y `cola`).
# El esquema `sigat` NO se migra aquí: lo instala y versiona el paquete de BD SIGAT.
[alembic]
script_location = migrations
version_table_schema = api
prepend_sys_path = src

[loggers]
keys = root,alembic
[handlers]
keys = consola
[formatters]
keys = simple
[logger_root]
level = WARN
handlers = consola
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_consola]
class = StreamHandler
args = (sys.stderr,)
formatter = simple
[formatter_simple]
format = %(levelname)-5.5s [%(name)s] %(message)s
