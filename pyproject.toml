[project]
name = "sigat-durazno-api"
version = "0.1.0"
description = "Backend único (monolito modular) para la web SIGAT y la app móvil de vigilancia del durazno. Base de datos SIGAT v8 (PostgreSQL + PostGIS)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Propietario" }
dependencies = [
  # HTTP y contrato
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "python-multipart>=0.0.9",
  "orjson>=3.10",
  # Base de datos SIGAT (PostgreSQL 16 + PostGIS)
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "geoalchemy2>=0.15",
  "shapely>=2.0",
  "alembic>=1.13",
  # Seguridad
  "pyjwt[crypto]>=2.9",
  "argon2-cffi>=23.1",
  # Huella de contenido (JSON canónico RFC 8785) para la idempotencia del sync
  "rfc8785>=0.1.4",
  # Almacenamiento de objetos (S3 compatible)
  "aioboto3>=13.0",
  # Cola de trabajo sobre PostgreSQL (esquema `cola`, mismo despliegue: ADR-14)
  "procrastinate>=2.0",
  # Observabilidad
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
  "sqlacodegen>=3.0.0",
  "pre-commit>=3.7",
  "pip-audit>=2.7",
  "detect-secrets>=1.5",
  "testcontainers[postgres]>=4.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sigat_api"]

# ----------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC", "DTZ", "PT"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # textos en español con tildes y signos
  "B008",                        # Depends() en parámetros es el patrón de FastAPI
  "E501",
  "N818",                        # excepciones con nombres de dominio en español (NoEncontrado, Conflicto)
  "UP046",                       # Generic[T] explícito en esquemas pydantic                        # el formateador controla el largo; textos largos en español
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
"migrations/**" = ["N999"]

[tool.ruff.format]
quote-style = "double"

# ----------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["sigat_api"]

[[tool.mypy.overrides]]
module = ["procrastinate.*", "aioboto3.*", "rfc8785.*", "geoalchemy2.*", "shapely.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "integracion: requiere PostgreSQL/PostGIS con el esquema SIGAT v8 instalado",
  "regla: prueba de una regla de negocio (cuenta para la cobertura de RNF-017)",
]

[tool.coverage.run]
source = ["src/sigat_api"]
branch = true

[tool.coverage.report]
# RNF-017 / ADR-17: la puerta de fusión es 80 % sobre las reglas de negocio.
fail_under = 80
show_missing = true
include = [
  "src/sigat_api/modules/*/servicio.py",
  "src/sigat_api/modules/*/dominio.py",
  "src/sigat_api/modules/sincronizacion/*.py",
  "src/sigat_api/modules/registro/*.py",
  "src/sigat_api/modules/concepto/*.py",
]

# ----------------------------------------------------------------------------- import-linter
# ADR-14 / ADR-17: las fronteras de módulo se verifican con análisis estático.
[tool.importlinter]
root_package = "sigat_api"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Capas: api -> modules -> infra (nunca al revés)"
type = "layers"
layers = [
  "sigat_api.main | sigat_api.worker | sigat_api.cli",
  "sigat_api.api",
  "sigat_api.modules",
  "sigat_api.infra",
  "sigat_api.compartido",
  "sigat_api.config",
]

[[tool.importlinter.contracts]]
name = "Módulos independientes: un módulo no importa otro (se comunican por puertos inyectados)"
type = "independence"
modules = [
  "sigat_api.modules.identidad",
  "sigat_api.modules.catalogo",
  "sigat_api.modules.configuracion",
  "sigat_api.modules.registro",
  "sigat_api.modules.sincronizacion",
  "sigat_api.modules.imagenes",
  "sigat_api.modules.concepto",
  "sigat_api.modules.planificacion",
  "sigat_api.modules.notificaciones",
  "sigat_api.modules.auditoria",
]
