# Entorno de DESARROLLO. La base arranca VACÍA (sin cuentas de usuario):
#   docker compose up -d db      -> PostgreSQL 16 + PostGIS en localhost:5432
#   alembic upgrade head          -> crea el esquema SIGAT v9 y el esquema api (desde bd/sql y migrations/)
#   python -m sigat_api.cli inicializar-admin  -> su primer administrador (ver README)
# Para empezar de cero:  docker compose down -v
name: sigat-durazno
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sigat
      POSTGRES_USER: ${SIGAT_DB_ADMIN_USUARIO:-sigat_admin}
      POSTGRES_PASSWORD: ${SIGAT_DB_ADMIN_CLAVE:?defina SIGAT_DB_ADMIN_CLAVE en .env}
    ports: ["5432:5432"]
    volumes:
      - db_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d sigat"]
      interval: 5s
      retries: 10

  almacen:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SIGAT_S3_ACCESO:?defina SIGAT_S3_ACCESO en .env}
      MINIO_ROOT_PASSWORD: ${SIGAT_S3_SECRETO:?defina SIGAT_S3_SECRETO en .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: [almacen_datos:/data]

  api:
    build: .
    env_file: .env
    environment:
      # Dentro de docker la base se llama `db`, no localhost.
      SIGAT_DB_URL: postgresql+asyncpg://${SIGAT_DB_ADMIN_USUARIO:-sigat_admin}:${SIGAT_DB_ADMIN_CLAVE}@db:5432/sigat
    command: ["sh", "-c", "alembic upgrade head && uvicorn sigat_api.main:app --host 0.0.0.0 --port 8000 --proxy-headers"]
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  worker:
    build: .
    env_file: .env
    environment:
      SIGAT_DB_URL: postgresql+asyncpg://${SIGAT_DB_ADMIN_USUARIO:-sigat_admin}:${SIGAT_DB_ADMIN_CLAVE}@db:5432/sigat
    command: ["python", "-m", "sigat_api.worker"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  db_datos:
  almacen_datos:
