# Puertas de calidad (Arquitectura §9.3). Ninguna fusión a main sin verde.
name: ci
on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Formato
        run: ruff format --check src tests scripts
      - name: Análisis estático
        run: ruff check src tests scripts
      - name: Tipos
        run: mypy
      - name: Fronteras de módulo (ADR-14, ADR-17)
        run: lint-imports
      - name: Contrato OpenAPI sincronizado con el código
        run: python scripts/exportar_openapi.py --verificar
      - name: Pruebas unitarias y de reglas
        run: pytest -m "not integracion" --cov --cov-report=xml
      - name: Dependencias vulnerables
        # El propio paquete (instalado en modo editable) no está en PyPI: se omite SOLO ese y se
        # auditan además, con --strict, las versiones congeladas de todas las demás dependencias.
        run: |
          pip-audit --skip-editable
          pip freeze --exclude-editable > "$RUNNER_TEMP/congelado.txt"
          pip-audit -r "$RUNNER_TEMP/congelado.txt" --disable-pip --no-deps --strict
      - name: Barrido de secretos
        run: detect-secrets scan --exclude-files '(contracts/openapi\.json|\.env\.example|README\.md)' | python -c "import json,sys; r=json.load(sys.stdin)['results']; sys.exit(1 if r else 0)"

  cambios-bd:
    # Detiene el PR si una migración o un SQL elimina tablas, columnas, relaciones o datos, hasta que
    # el responsable de la BD ponga la etiqueta «bd-destructivo-aprobado». También exige que cada
    # migración nueva esté descrita en bd/CAMBIOS.md y rechaza volcados y hashes de contraseña.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Revisar cambios de base de datos
        env:
          SIGAT_RAMA_BASE: origin/${{ github.base_ref }}
          SIGAT_BD_DESTRUCTIVO_APROBADO: ${{ contains(github.event.pull_request.labels.*.name, 'bd-destructivo-aprobado') && '1' || '0' }}
        run: python scripts/revisar_migraciones.py

  integracion:
    runs-on: ubuntu-latest
    needs: calidad
    services:
      db:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_DB: sigat, POSTGRES_USER: ci, POSTGRES_PASSWORD: ci }  # pragma: allowlist secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d sigat" --health-interval 5s --health-retries 10
    env:
      # Las pruebas crean y borran sus propias bases en este servidor (ver tests/integracion/conftest.py).
      SIGAT_DB_URL_PRUEBAS: postgresql+asyncpg://ci:ci@localhost:5432/postgres  # pragma: allowlist secret
      SIGAT_JWT_SECRETO: solo-para-ci-un-secreto-de-mas-de-treinta-y-dos-caracteres  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Instalación limpia (alembic), primer administrador, login, permisos y migraciones
        run: pytest -m integracion
